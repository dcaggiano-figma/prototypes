name: Backfill Share Metadata

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure AWS credentials
        uses: figma/actions-configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 #v4.0.2
        with:
          role-to-assume: arn:aws:iam::133326480594:role/protov2_playground_workflow_role
          aws-region: us-east-1

      - name: Discover all shared branches
        run: |
          echo "Listing all index.html files under share/ ..."

          # Find every index.html in S3 under share/
          aws s3api list-objects-v2 \
            --bucket figma-protov2 \
            --prefix "share/" \
            --query "Contents[?ends_with(Key, '/index.html')].Key" \
            --output text | tr '\t' '\n' | grep -v '^$' > /tmp/all-index-html.txt || true

          TOTAL=$(wc -l < /tmp/all-index-html.txt | tr -d ' ')
          echo "Found $TOTAL index.html files total"

          # Extract unique branch names.
          # Paths look like: share/{branch}/{sha-or-latest-or-pin}/index.html
          # The branch may contain slashes, but the last segment before index.html
          # is always the sha/latest/pin. Strip share/ prefix and /*/index.html suffix.
          > /tmp/branches.txt
          while IFS= read -r key; do
            [ -z "$key" ] && continue
            # Remove share/ prefix
            path="${key#share/}"
            # Remove trailing /index.html
            path="${path%/index.html}"
            # Remove the last path segment (sha, latest, or pin name)
            branch="${path%/*}"
            [ -n "$branch" ] && echo "$branch"
          done < /tmp/all-index-html.txt | sort -u > /tmp/branches.txt

          BRANCH_COUNT=$(wc -l < /tmp/branches.txt | tr -d ' ')
          echo "Found $BRANCH_COUNT unique branches"

      - name: Backfill latest/ and metadata for each branch
        run: |
          CREATED_LATEST=0
          CREATED_META=0
          SKIPPED=0

          while IFS= read -r branch; do
            [ -z "$branch" ] && continue

            echo ""
            echo "=== $branch ==="

            # --- Step 1: Ensure a latest/ deploy exists ---

            HAS_LATEST=false
            if aws s3api head-object --bucket figma-protov2 --key "share/$branch/latest/index.html" 2>/dev/null; then
              HAS_LATEST=true
              echo "  latest/ exists"
            fi

            if [ "$HAS_LATEST" = false ]; then
              # Find the most recent SHA deploy for this branch.
              # List all index.html files for this branch, exclude "latest" and known pins,
              # then pick the last one (S3 lists lexicographically, SHA prefixes approximate time order).
              LATEST_SHA_KEY=""
              while IFS= read -r key; do
                [ -z "$key" ] && continue
                # Extract the segment after the branch name
                suffix="${key#share/$branch/}"
                segment="${suffix%%/*}"
                # Skip "latest" or anything that doesn't look like a short sha (8 hex chars)
                if [ "$segment" = "latest" ]; then continue; fi
                LATEST_SHA_KEY="$key"
              done < <(grep "^share/$branch/" /tmp/all-index-html.txt)

              if [ -z "$LATEST_SHA_KEY" ]; then
                echo "  No SHA deploy found — skipping"
                SKIPPED=$((SKIPPED + 1))
                continue
              fi

              # Derive the SHA prefix directory
              sha_path="${LATEST_SHA_KEY%/index.html}"
              sha_segment="${sha_path##*/}"
              echo "  Copying $sha_segment -> latest/"

              aws s3 sync \
                "s3://figma-protov2/share/$branch/$sha_segment/" \
                "s3://figma-protov2/share/$branch/latest/" \
                --quiet

              CREATED_LATEST=$((CREATED_LATEST + 1))
            fi

            # --- Step 2: Ensure metadata.json exists at latest/ ---

            if aws s3api head-object --bucket figma-protov2 --key "share/$branch/latest/metadata.json" 2>/dev/null; then
              echo "  metadata.json already exists"
              SKIPPED=$((SKIPPED + 1))
              continue
            fi

            URL="https://protov2.figma.design/share/$branch/latest/"

            # Try to get git metadata from the branch
            AUTHOR=""
            MESSAGE=""
            TIMESTAMP=""
            SHA=""

            BRANCH_SHA=$(git rev-parse "origin/$branch" 2>/dev/null || echo "")
            if [ -n "$BRANCH_SHA" ]; then
              SHA=$(echo "$BRANCH_SHA" | cut -c1-8)
              AUTHOR=$(git log -1 --format='%an' "$BRANCH_SHA" 2>/dev/null || echo "")
              MESSAGE=$(git log -1 --format='%s' "$BRANCH_SHA" 2>/dev/null || echo "")
              TIMESTAMP=$(git log -1 --format='%aI' "$BRANCH_SHA" 2>/dev/null || echo "")
            fi

            # Fall back to S3 object timestamp
            if [ -z "$TIMESTAMP" ]; then
              TIMESTAMP=$(aws s3api head-object \
                --bucket figma-protov2 \
                --key "share/$branch/latest/index.html" \
                --query "LastModified" \
                --output text 2>/dev/null || echo "")
            fi

            if [ -z "$AUTHOR" ]; then AUTHOR="Unknown"; fi
            if [ -z "$MESSAGE" ]; then MESSAGE="$branch"; fi
            if [ -z "$SHA" ]; then SHA="unknown"; fi
            if [ -z "$TIMESTAMP" ]; then TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"; fi

            # Placeholder metadata for pre-description shares
            SUMMARY="This prototype was published before descriptions were added."
            HASHTAGS='["#beta-share"]'

            echo "  Writing placeholder metadata (author: $AUTHOR)"

            jq -n \
              --arg branch "$branch" \
              --arg sha "$SHA" \
              --arg author "$AUTHOR" \
              --arg message "$MESSAGE" \
              --arg timestamp "$TIMESTAMP" \
              --arg url "$URL" \
              --arg pin "" \
              --arg summary "$SUMMARY" \
              --argjson hashtags "$HASHTAGS" \
              '{branch: $branch, sha: $sha, author: $author, message: $message, timestamp: $timestamp, url: $url, pin: $pin, summary: $summary, hashtags: $hashtags}' \
              > /tmp/metadata.json

            aws s3 cp /tmp/metadata.json \
              "s3://figma-protov2/share/$branch/latest/metadata.json" \
              --content-type "application/json"

            CREATED_META=$((CREATED_META + 1))
          done < /tmp/branches.txt

          echo ""
          echo "Backfill complete:"
          echo "  latest/ folders created: $CREATED_LATEST"
          echo "  metadata.json files created: $CREATED_META"
          echo "  skipped (already had metadata): $SKIPPED"
