name: Share Pinned

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  packages: read

jobs:
  share:
    runs-on: ubuntu-latest
    concurrency:
      group: share-pinned-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Authenticate to GitHub Packages
        run: echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> ~/.npmrc

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Validate .share-metadata.json
        run: ci-scripts/validate-share-metadata.sh apps/prototype/.share-metadata.json

      - name: Build
        run: pnpm run build --base "./"

      - name: Generate metadata
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_SHA: ${{ github.sha }}
          GH_BRANCH: ${{ github.ref_name }}
        run: |
          SHORT_SHA=$(echo "$GH_SHA" | cut -c1-8)

          # Read metadata from the repo
          DESCRIPTION=$(jq -r '.description // ""' apps/prototype/.share-metadata.json)
          TAGS=$(jq -c '.tags // []' apps/prototype/.share-metadata.json)
          AUTHOR=$(jq -r '.author // ""' apps/prototype/.share-metadata.json)

          # Fall back to git actor if no author in metadata
          if [ -z "$AUTHOR" ]; then
            AUTHOR="$GH_ACTOR"
          fi

          jq -n \
            --arg description "$DESCRIPTION" \
            --arg author "$AUTHOR" \
            --argjson tags "$TAGS" \
            --arg branch "$GH_BRANCH" \
            --arg commit "$SHORT_SHA" \
            --arg timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              description: $description,
              author: $author,
              tags: $tags,
              base: {
                branch: $branch,
                commit: $commit,
                timestamp: $timestamp
              }
            }' \
            > apps/prototype/dist/metadata.json

      - name: Configure AWS credentials
        uses: figma/actions-configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 #v4.0.2
        with:
          role-to-assume: arn:aws:iam::133326480594:role/protov2_playground_workflow_role
          aws-region: us-east-1

      - name: Share
        env:
          GH_BRANCH: ${{ github.ref_name }}
          GH_SHA: ${{ github.sha }}
        run: |
          SHORT_SHA=$(echo "$GH_SHA" | cut -c1-8)
          ./ci-scripts/share.sh --branch "$GH_BRANCH" --sha "$SHORT_SHA" --dist apps/prototype/dist

      - name: Trigger index rebuild
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Triggering share index rebuild..."
          gh workflow run rebuild-share-index.yml --ref main
