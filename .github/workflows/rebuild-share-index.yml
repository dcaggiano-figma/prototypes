name: Rebuild Share Index

on:
  workflow_run:
    workflows: ["Share Pinned"]
    types: [completed]
  workflow_dispatch:
    inputs:
      prefix:
        description: 'S3 prefix to scan (default: share, use share-test for testing)'
        required: false
        default: 'share'

concurrency:
  group: rebuild-share-index
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

jobs:
  rebuild-index:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: figma/actions-configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 #v4.0.2
        with:
          role-to-assume: arn:aws:iam::133326480594:role/protov2_playground_workflow_role
          aws-region: us-east-1

      - name: Determine prefix
        run: |
          # workflow_dispatch: use the input; workflow_run: default to "share"
          PREFIX="${{ github.event.inputs.prefix }}"
          if [ -z "$PREFIX" ]; then
            PREFIX="share"
          fi
          echo "PREFIX=$PREFIX" >> "$GITHUB_ENV"
          echo "Using prefix: $PREFIX"

      - name: Download all metadata files
        run: |
          echo "Syncing */latest/metadata.json files from $PREFIX/..."
          aws s3 sync "s3://figma-protov2/$PREFIX/" /tmp/metadata/ \
            --exclude "*" \
            --include "*/latest/metadata.json"

          find /tmp/metadata -name metadata.json -path "*/latest/metadata.json" > /tmp/files.txt
          TOTAL=$(wc -l < /tmp/files.txt | tr -d ' ')
          echo "Downloaded $TOTAL metadata files"

      - name: Build index from metadata
        run: |
          echo "[" > /tmp/index.json
          FIRST=true
          INCLUDED=0
          SKIPPED=0

          while IFS= read -r file; do
            [ -z "$file" ] && continue

            # Derive a label for logging (e.g. user/branch)
            LABEL="${file#/tmp/metadata/}"

            echo "  Checking $LABEL..."

            # --- Validation 1: Must be valid JSON with required fields ---
            if ! jq empty "$file" 2>/dev/null; then
              echo "    SKIP: invalid JSON"
              SKIPPED=$((SKIPPED + 1))
              continue
            fi

            MISSING_FIELDS=""
            for field in description author; do
              if ! jq -e "has(\"$field\")" "$file" > /dev/null 2>&1; then
                MISSING_FIELDS="$MISSING_FIELDS $field"
              fi
            done
            if ! jq -e '.base.branch // empty' "$file" > /dev/null 2>&1; then
              MISSING_FIELDS="$MISSING_FIELDS base.branch"
            fi

            if [ -n "$MISSING_FIELDS" ]; then
              echo "    SKIP: missing required fields:$MISSING_FIELDS"
              SKIPPED=$((SKIPPED + 1))
              continue
            fi

            # --- Validation 2: Only include entries explicitly shown on share page ---
            if jq -e '.hideFromSharePage == true' "$file" > /dev/null 2>&1; then
              echo "    SKIP: hideFromSharePage is true"
              SKIPPED=$((SKIPPED + 1))
              continue
            fi

            # --- Entry passed all checks — include it ---
            if [ "$FIRST" = true ]; then
              FIRST=false
            else
              echo "," >> /tmp/index.json
            fi
            cat "$file" >> /tmp/index.json
            INCLUDED=$((INCLUDED + 1))
          done < /tmp/files.txt
          echo "]" >> /tmp/index.json

          echo ""
          echo "Validation complete: $INCLUDED included, $SKIPPED skipped"

      - name: Upload index
        run: |
          INCLUDED=$(jq length /tmp/index.json)
          echo "Uploading index.json with $INCLUDED entries..."
          aws s3 cp /tmp/index.json \
            "s3://figma-protov2/$PREFIX/index.json" \
            --content-type "application/json" \
            --cache-control "max-age=0, no-cache"
          echo "Index rebuilt with $INCLUDED entries at $PREFIX/index.json"
