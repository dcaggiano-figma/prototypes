name: Rebuild Share Index

on:
  workflow_run:
    workflows: ["Share Pinned"]
    types: [completed]
  workflow_dispatch:
    inputs:
      prefix:
        description: 'S3 prefix to scan (default: share, use share-test for testing)'
        required: false
        default: 'share'

concurrency:
  group: rebuild-share-index
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

jobs:
  rebuild-index:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: figma/actions-configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 #v4.0.2
        with:
          role-to-assume: arn:aws:iam::133326480594:role/protov2_playground_workflow_role
          aws-region: us-east-1

      - name: Determine prefix
        run: |
          # workflow_dispatch: use the input; workflow_run: default to "share"
          PREFIX="${{ github.event.inputs.prefix }}"
          if [ -z "$PREFIX" ]; then
            PREFIX="share"
          fi
          echo "PREFIX=$PREFIX" >> "$GITHUB_ENV"
          echo "Using prefix: $PREFIX"

      - name: Rebuild index from latest metadata files
        run: |
          echo "Listing latest/metadata.json files in $PREFIX/..."

          # Only scan */latest/metadata.json — one entry per branch by design
          aws s3api list-objects-v2 \
            --bucket figma-protov2 \
            --prefix "$PREFIX/" \
            --query "Contents[?ends_with(Key, '/latest/metadata.json')].Key" \
            --output text | tr '\t' '\n' | grep -v '^$' > /tmp/keys.txt || true

          NEW_COUNT=$(wc -l < /tmp/keys.txt | tr -d ' ')
          echo "Found $NEW_COUNT metadata files"

          # Build the new index
          echo "[" > /tmp/index.json
          FIRST=true
          while IFS= read -r key; do
            if [ -z "$key" ]; then continue; fi

            echo "  Fetching $key..."
            if aws s3 cp "s3://figma-protov2/$key" /tmp/entry.json 2>/dev/null; then
              if [ "$FIRST" = true ]; then
                FIRST=false
              else
                echo "," >> /tmp/index.json
              fi
              cat /tmp/entry.json >> /tmp/index.json
            fi
          done < /tmp/keys.txt
          echo "]" >> /tmp/index.json

          # Size guard: refuse to upload if the new index is smaller than the existing one
          OLD_COUNT=0
          if aws s3 cp "s3://figma-protov2/$PREFIX/index.json" /tmp/old-index.json 2>/dev/null; then
            OLD_COUNT=$(jq 'length' /tmp/old-index.json 2>/dev/null || echo 0)
          fi

          echo "Old index: $OLD_COUNT entries, New index: $NEW_COUNT entries"

          if [ "$NEW_COUNT" -lt "$OLD_COUNT" ]; then
            echo "::error::New index has $NEW_COUNT entries but existing has $OLD_COUNT — refusing to upload a smaller index. This may indicate an S3 listing issue."
            exit 1
          fi

          echo "Uploading index.json with $NEW_COUNT entries..."
          aws s3 cp /tmp/index.json \
            "s3://figma-protov2/$PREFIX/index.json" \
            --content-type "application/json" \
            --cache-control "max-age=0, no-cache"

          echo "Index rebuilt with $NEW_COUNT entries at $PREFIX/index.json"
