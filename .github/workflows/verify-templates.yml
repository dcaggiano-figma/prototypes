name: Verify Templates

on:
  push:
    branches: [main]
    paths:
      - 'templates/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/verify-templates.yml'
  pull_request:
    paths:
      - 'templates/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/verify-templates.yml'

permissions:
  contents: read
  packages: read

jobs:
  check-template-ids:
    runs-on: ubuntu-latest
    name: Check for duplicate template IDs
    steps:
      - uses: actions/checkout@v4

      - name: Check for duplicate template IDs
        run: |
          ids=""
          dupes=""
          for f in templates/*/template.json; do
            dir="$(basename "$(dirname "$f")")"
            id="$(node -p "require('./$f').id")"
            if echo "$ids" | grep -q "^$id:"; then
              existing="$(echo "$ids" | grep "^$id:" | cut -d: -f2)"
              dupes="${dupes}Duplicate template id '$id' found in '$dir' and '$existing'\n"
            fi
            ids="${ids}${id}:${dir}\n"
          done
          if [ -n "$dupes" ]; then
            printf "$dupes"
            exit 1
          fi
          echo "All template IDs are unique."

  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        template:
          - blank-slate
          - browser-shell
          - eval-starter
          - figma-buzz
          - figma-design
          - figma-figjam
          - make

    name: ${{ matrix.template }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Authenticate to GitHub Packages
        run: echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> ~/.npmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve package name
        id: pkg
        run: echo "name=$(node -p "require('./templates/${{ matrix.template }}/package.json').name")" >> "$GITHUB_OUTPUT"

      - name: Build
        run: pnpm --filter '${{ steps.pkg.outputs.name }}' build

      - name: Typecheck
        run: pnpm --filter '${{ steps.pkg.outputs.name }}' typecheck

      - name: Lint
        run: pnpm --filter '${{ steps.pkg.outputs.name }}' lint

      - name: Verify dist output
        run: |
          if [ ! -d "templates/${{ matrix.template }}/dist" ]; then
            echo "::error::Build produced no dist/ directory for template '${{ matrix.template }}'"
            exit 1
          fi
          echo "dist/ contains $(find templates/${{ matrix.template }}/dist -type f | wc -l) files"
